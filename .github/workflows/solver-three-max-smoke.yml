name: 3Max Solver Smoke

on:
  push:
    branches: [chat-aligned-v2]
    paths:
      - '.github/workflows/solver-three-max-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-max-8bb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Solve 3-max 8bb independently
        run: |
          mkdir -p solver/output
          python -m solver.run_three_max_mccfr \
            --stack 8 \
            --iterations 100000 \
            --seed 20260910 \
            --output solver/output/three-max-8bb-100k.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: three-max-8bb-100k
          path: solver/output/three-max-8bb-100k.json
          if-no-files-found: error
          retention-days: 7
