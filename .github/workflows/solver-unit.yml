name: Solver Unit Tests

on:
  pull_request:
    paths:
      - 'solver/**'
      - 'tests/**'
      - '.github/workflows/solver-unit.yml'
  push:
    branches: [chat-aligned-v2]
    paths:
      - 'solver/**'
      - 'tests/**'
      - '.github/workflows/solver-unit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all solver tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
