name: Chart Audit

on:
  push:
    branches: [main, chat-aligned-v2]
    paths:
      - 'data/**'
      - 'scripts/validate-chart-data.mjs'
      - '.github/workflows/chart-audit.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/validate-chart-data.mjs'
      - '.github/workflows/chart-audit.yml'

permissions:
  contents: read

jobs:
  validate-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate chart data
        run: node scripts/validate-chart-data.mjs
