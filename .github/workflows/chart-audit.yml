name: Chart Audit

on:
  push:
    branches: [main, chat-aligned-v2]
    paths:
      - 'data/**'
      - 'solver/**'
      - 'tests/**'
      - 'scripts/validate-chart-data.mjs'
      - '.github/workflows/chart-audit.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'solver/**'
      - 'tests/**'
      - 'scripts/validate-chart-data.mjs'
      - '.github/workflows/chart-audit.yml'

permissions:
  contents: read

jobs:
  validate-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate chart data
        run: node scripts/validate-chart-data.mjs
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run solver tests
        run: python -m unittest discover -s tests -p 'test_solver.py' -v
