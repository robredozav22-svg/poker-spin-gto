name: 3Max Solver Convergence

on:
  pull_request:
    paths:
      - 'solver/**'
      - 'tests/test_solver.py'
      - '.github/workflows/solver-three-max-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convergence-8bb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest tests.test_solver
      - name: Compare independent 3-max runs
        run: |
          mkdir -p solver/output
          python -m solver.run_three_max_convergence \
            --stack 8 \
            --iterations-a 100000 \
            --iterations-b 300000 \
            --seed-a 20260910 \
            --seed-b 20260911 \
            --output solver/output/three-max-8bb-convergence.json
      - name: Upload convergence report
        uses: actions/upload-artifact@v4
        with:
          name: three-max-8bb-convergence
          path: solver/output/three-max-8bb-convergence.json
          if-no-files-found: error
          retention-days: 7
