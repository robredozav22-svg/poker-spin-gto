name: 3Max Fixed Corpus Benchmark [ARCHIVED]

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-corpus-8bb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest tests.test_solver
      - name: Solve fixed-corpus 8bb
        run: |
          mkdir -p solver/output
          python -m solver.run_three_max_batch \
            --stack 8 \
            --sweeps 300 \
            --samples-per-hand 8 \
            --corpus-seed 20260916 \
            --output solver/output/three-max-batch-8bb-300s.json
      - name: Compare independent corpora
        run: |
          python -m solver.run_three_max_batch_convergence \
            --stack 8 \
            --sweeps-a 200 \
            --sweeps-b 600 \
            --samples-per-hand 8 \
            --corpus-seed-a 20260916 \
            --corpus-seed-b 20260917 \
            --output solver/output/three-max-batch-8bb-convergence.json
      - name: Compare to reference anchor
        run: |
          python -m solver.run_reference_compare \
            --solver-json solver/output/three-max-batch-8bb-300s.json \
            --anchors data/source-verified-anchors.json \
            --output solver/output/three-max-batch-8bb-reference-delta.json
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: three-max-batch-8bb-benchmark
          path: |
            solver/output/three-max-batch-8bb-300s.json
            solver/output/three-max-batch-8bb-convergence.json
            solver/output/three-max-batch-8bb-reference-delta.json
          if-no-files-found: error
          retention-days: 7
