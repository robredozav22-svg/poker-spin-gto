name: Phase E Leduc Validation

on:
  push:
    branches: [chat-aligned-v2]
    paths:
      - 'solver-rs/src/leduc_cfr.rs'
      - 'solver-rs/src/bin/leduc_cfr_smoke.rs'
      - 'solver-rs/src/lib.rs'
      - '.github/workflows/phase-e-leduc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leduc:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Run fast Leduc structural tests
        working-directory: solver-rs
        run: |
          cargo test --lib leduc_cfr::tests::chance_deals_are_exactly_120
          cargo test --lib leduc_cfr::tests::showdown_pair_beats_high_card
      - name: Run optimized Leduc sequence-form value smoke
        working-directory: solver-rs
        run: cargo run --release --bin leduc_cfr_smoke
