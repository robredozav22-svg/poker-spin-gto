<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin & Go GTO Калькулятор</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #161b22, #21262d);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #30363d;
        }
        
        .header h1 {
            margin: 0;
            font-size: 18px;
            color: #58a6ff;
        }
        
        .header small {
            color: #8b949e;
            font-size: 11px;
        }
        
        .controls-panel {
            background: #161b22;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #30363d;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        
        .param-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .param-label {
            font-size: 10px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 4px;
        }
        
        .btn-group {
            display: flex;
            gap: 2px;
            background: #0d1117;
            border-radius: 4px;
            padding: 2px;
        }
        
        .btn-toggle {
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: #8b949e;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
        }
        
        .btn-toggle:hover {
            color: #c9d1d9;
            background: #21262d;
        }
        
        .btn-toggle.active {
            background: #238636;
            color: #fff;
        }
        
        .btn-toggle.active-blue {
            background: #1f6feb;
            color: #fff;
        }
        
        .action-buttons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid #30363d;
            background: #21262d;
            color: #8b949e;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .action-btn:hover {
            background: #30363d;
            color: #c9d1d9;
        }
        
        .action-btn.active {
            background: #1f6feb;
            color: #fff;
            border-color: #1f6feb;
        }
        
        .hand-input {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #0d1117;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #30363d;
        }
        
        .hand-input input {
            width: 70px;
            background: transparent;
            color: #c9d1d9;
            border: none;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            outline: none;
        }
        
        .hand-input button {
            padding: 4px 8px;
            font-size: 11px;
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .result-bar {
            background: #161b22;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            min-height: 36px;
        }
        
        .result-action {
            font-size: 16px;
            font-weight: bold;
        }
        
        .result-details {
            font-size: 11px;
            color: #8b949e;
        }
        
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 6px;
            padding: 6px;
            background: #161b22;
            border-radius: 6px;
            border: 1px solid #30363d;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 10px;
        }
        
        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }
        
        .chart-container {
            background: #161b22;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #30363d;
            max-width: 800px;
            margin: 0 auto;
        }
        
        #chartGrid {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 1px;
            width: 100%;
        }
        
        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            cursor: pointer;
            border-radius: 2px;
            font-weight: 600;
            transition: all 0.15s;
            position: relative;
            border: 1px solid transparent;
        }
        
        .cell:hover {
            transform: scale(1.08);
            z-index: 5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            border-color: #fff;
        }
        
        .cell.selected {
            border-color: #fff;
            box-shadow: 0 0 0 2px #58a6ff;
        }
        
        .cell-text {
            position: relative;
            z-index: 2;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }
        
        .cell-freq {
            position: absolute;
            bottom: 1px;
            right: 1px;
            font-size: 6px;
            opacity: 0.8;
            z-index: 2;
        }
        
        .raise { background: linear-gradient(135deg, #da3633, #f85149); color: #fff; }
        .call { background: linear-gradient(135deg, #1f6feb, #388bfd); color: #fff; }
        .fold { background: #21262d; color: #8b949e; }
        .mixed { background: linear-gradient(135deg, #9e6a03, #d29922); color: #000; }
        .allin { background: linear-gradient(135deg, #8957e5, #a371f7); color: #fff; }
        .empty { background: #161b22; color: #484f58; }
        
        .hint {
            font-size: 9px;
            color: #8b949e;
            text-align: center;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 Spin & Go GTO</h1>
        <small>3-max · Быстрое переключение</small>
    </div>

    <!-- Компактная панель управления -->
    <div class="controls-panel">
        <!-- Стек -->
        <div class="param-group">
            <span class="param-label">Стек:</span>
            <div class="btn-group">
                <button class="btn-toggle" onclick="setStack('8')">8</button>
                <button class="btn-toggle" onclick="setStack('10')">10</button>
                <button class="btn-toggle" onclick="setStack('12')">12</button>
                <button class="btn-toggle active" onclick="setStack('15')">15</button>
                <button class="btn-toggle" onclick="setStack('20')">20</button>
                <button class="btn-toggle" onclick="setStack('25')">25</button>
            </div>
        </div>
        
        <!-- Позиция -->
        <div class="param-group">
            <span class="param-label">Поз:</span>
            <div class="btn-group">
                <button class="btn-toggle active-blue" onclick="setPosition('BTN')">BTN</button>
                <button class="btn-toggle" onclick="setPosition('SB')">SB</button>
                <button class="btn-toggle" onclick="setPosition('BB')">BB</button>
            </div>
        </div>
        
        <!-- Действие -->
        <div class="param-group">
            <span class="param-label">Действие:</span>
            <div class="action-buttons">
                <button class="action-btn active" onclick="setAction('RFI')">RFI</button>
                <button class="action-btn" onclick="setAction('3bet')">3-бет</button>
                <button class="action-btn" onclick="setAction('defend')">Защита</button>
                <button class="action-btn" onclick="setAction('pushfold')">Пуш/Фолд</button>
                <button class="action-btn" onclick="setAction('limp')">Лими</button>
            </div>
        </div>
        
        <!-- Рука -->
        <div class="hand-input">
            <input type="text" id="hand" placeholder="AKs" maxlength="4" onkeypress="if(event.key==='Enter')analyze()">
            <button onclick="analyze()">OK</button>
        </div>
        
        <!-- Полный экран -->
        <button onclick="toggleFullscreen()" style="padding:4px 8px; font-size:11px; background:#21262d; color:#c9d1d9; border:1px solid #30363d; border-radius:4px; cursor:pointer;">⛶</button>
    </div>

    <!-- Результат -->
    <div class="result-bar">
        <div class="result-action" id="resultAction">Выберите руку</div>
        <div class="result-details" id="resultDetails"></div>
    </div>

    <!-- Легенда -->
    <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background:#f85149"></div>Рейз</div>
        <div class="legend-item"><div class="legend-color" style="background:#388bfd"></div>Колл</div>
        <div class="legend-item"><div class="legend-color" style="background:#21262d"></div>Фолд</div>
        <div class="legend-item"><div class="legend-color" style="background:#d29922"></div>Микс</div>
        <div class="legend-item"><div class="legend-color" style="background:#a371f7"></div>All-in</div>
    </div>

    <!-- Чарт -->
    <div class="chart-container">
        <div id="chartGrid"></div>
    </div>
    
    <div class="hint">💡 Кликните на ячейку для анализа</div>
