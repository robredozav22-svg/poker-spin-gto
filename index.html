<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>SPINS — Preflop Trainer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="brand">SPINS</div>
        <div class="mode">study / review · V44 prototype</div>
      </div>
      <div style="display:flex;gap:8px">
        <button id="huToggle" class="stack-btn" style="min-width:56px">HU</button>
        <button id="reset" class="stack-btn" style="min-width:64px">RESET</button>
      </div>
    </header>

    <section id="stacks" class="stack-strip" aria-label="Effective stack"></section>
    <section id="status" class="status"></section>

    <section class="grid-wrap">
      <div id="grid" class="hand-grid" aria-label="13 by 13 hand matrix"></div>
      <div id="gridWarning" class="warning"></div>
    </section>

    <section id="legend" class="legend"></section>
    <section id="tree" class="tree" aria-label="Decision tree"></section>

    <p class="footer-note">
      Источник данных отделён от интерфейса. Узлы со статусом SCREEN_CROSSCHECK используют только видимые aggregate frequencies из пользовательских референсов. Индивидуальные hand frequencies не показываются до VERIFIED_EXACT импорта.
    </p>
  </main>
  <script src="app.js"></script>
</body>
</html>
