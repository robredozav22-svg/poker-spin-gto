<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>SPINS — Preflop Trainer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="brand">SPINS</div>
        <div class="mode">REVIEW · V45 prototype</div>
      </div>
      <div class="top-actions">
        <button id="huToggle" class="stack-btn compact">HU</button>
        <button id="reset" class="stack-btn compact">RESET</button>
      </div>
    </header>

    <section id="stacks" class="stack-strip" aria-label="Effective stack"></section>

    <section class="nav-row" aria-label="History navigation">
      <button id="backBtn" class="nav-btn">← BACK</button>
      <button id="forwardBtn" class="nav-btn">FORWARD →</button>
      <button id="recentToggle" class="nav-btn">RECENT</button>
    </section>

    <section id="recentPanel" class="recent-panel hidden" aria-label="Recent spots"></section>
    <section id="status" class="status"></section>

    <section class="grid-wrap">
      <div id="grid" class="hand-grid" aria-label="13 by 13 hand matrix"></div>
      <div id="gridWarning" class="warning"></div>
    </section>

    <section id="legend" class="legend"></section>
    <section id="tree" class="tree" aria-label="Decision tree"></section>

    <p class="footer-note">
      REVIEW предназначен для разбора и обучения вне активной игры. Узлы со статусом CROSS-CHECK используют только видимые aggregate frequencies из референсов. Индивидуальные hand frequencies не показываются до VERIFIED_EXACT импорта.
    </p>
  </main>
  <script src="app.js"></script>
</body>
</html>
