<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#c9d1d9;font-family:Arial,sans-serif;padding:10px}
.header{background:#161b22;padding:10px;border-radius:8px;margin-bottom:10px;text-align:center;border:1px solid #30363d}
.header h1{font-size:20px;color:#58a6ff;margin:0}
.controls{display:flex;flex-wrap:wrap;gap:10px;background:#161b22;padding:10px;border-radius:8px;margin-bottom:10px;align-items:center;border:1px solid #30363d}
.param{display:flex;align-items:center;gap:5px}
.param label{font-size:11px;color:#8b949e}
.btn-group{display:flex;gap:2px}
.btn{padding:5px 10px;font-size:12px;border:none;background:#21262d;color:#8b949e;cursor:pointer;border-radius:4px}
.btn.active{background:#238636;color:#fff}
.btn.active-blue{background:#1f6feb;color:#fff}
.hand-input{display:flex;gap:5px;align-items:center}
.hand-input input{width:70px;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:5px;border-radius:4px;font-size:14px;text-align:center}
.hand-input button{background:#238636;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer}
.result{background:#161b22;padding:10px;border-radius:8px;margin-bottom:10px;text-align:center;border:1px solid #30363d}
.result .action{font-size:24px;font-weight:bold}
.legend{display:flex;gap:10px;margin-bottom:10px;padding:5px;background:#161b22;border-radius:5px}
.legend-item{display:flex;align-items:center;gap:3px;font-size:10px}
.legend-color{width:10px;height:10px;border-radius:2px}
#chartGrid{display:grid;grid-template-columns:repeat(13,1fr);gap:1px;background:#161b22;padding:5px;border-radius:8px}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer;border-radius:2px;font-weight:bold;transition:all .15s;border:1px solid transparent}
.cell:hover{transform:scale(1.1);box-shadow:0 2px 8px rgba(0,0,0,.6);border-color:#fff}
.cell.selected{border-color:#fff;box-shadow:0 0 0 2px #58a6ff}
.raise{background:linear-gradient(135deg,#da3633,#f85149);color:#fff}
.call{background:linear-gradient(135deg,#1f6feb,#388bfd);color:#fff}
.fold{background:#21262d;color:#8b949e}
.hint{font-size:10px;color:#8b949e;text-align:center;margin-top:5px}
</style>

<div class="param"><label>Поз:</label><div class="btn-group"><button class="btn active-blue" onclick="setPosition('BTN')">BTN</button><button class="btn" onclick="setPosition('SB')">SB</button><button class="btn" onclick="setPosition('BB')">BB</button></div></div>
<div class="param"><label>Действие:</label><div class="btn-group"><button class="btn active" onclick="setAction('RFI')">RFI</button><button class="btn" onclick="setAction('3bet')">3-бет</button><button class="btn" onclick="setAction('pushfold')">Пуш/Фолд</button></div></div>

let curStack='15', curPos='BTN', curAct='RFI';

// Функция для проверки входит ли рука в диапазон с '+'
function handInRange(hand, range) {
  if(range.includes(hand)) return true;
  
  // Проверяем пары: если в диапазоне есть '22+', то все пары от 22 до AA входят
  for(let r of range) {
    if(r.endsWith('+')) {
      const base = r.slice(0, -1);
      
      // Пары
      if(base.length === 2 && base[0] === base[1]) {
        const handRank = hand[0];
        const baseRank = base[0];
        const rankOrder = '23456789TJQKA';
        if(hand[0] === hand[1] && rankOrder.indexOf(handRank) >= rankOrder.indexOf(baseRank)) {
          return true;
        }
      }
      
      // Suited (одномастные)
      if(base.length === 3 && base[2] === 's') {
        const handSuit = hand.length === 3 && hand[2] === 's';
        if(handSuit) {
          const handRank1 = hand[0];
          const handRank2 = hand[1];
          const baseRank1 = base[0];
          const baseRank2 = base[1];
          const rankOrder = '23456789TJQKA';
          if(handRank1 === baseRank1 && rankOrder.indexOf(handRank2) >= rankOrder.indexOf(baseRank2)) {
            return true;
          }
          // Обратный порядок (например, A2s+ означает A2s, A3s... AKs)
          if(handRank2 === baseRank1 && rankOrder.indexOf(handRank1) >= rankOrder.indexOf(baseRank2)) {
            return true;
          }
        }
      }
      
      // Offsuit (разномастные)
      if(base.length === 3 && base[2] === 'o') {
        const handOff = hand.length === 3 && hand[2] === 'o';
        if(handOff) {
          const handRank1 = hand[0];
          const handRank2 = hand[1];
          const baseRank1 = base[0];
          const baseRank2 = base[1];
          const rankOrder = '23456789TJQKA';
          if(handRank1 === baseRank1 && rankOrder.indexOf(handRank2) >= rankOrder.indexOf(baseRank2)) {
            return true;
          }
          if(handRank2 === baseRank1 && rankOrder.indexOf(handRank1) >= rankOrder.indexOf(baseRank2)) {
            return true;
          }
        }
      }
    }
  }
  
  return false;
}

function init(){
  const g = document.getElementById('chartGrid');
  g.innerHTML = '';
  allHands.forEach(h=>{
    const c = document.createElement('div');
    c.className = 'cell fold';
    c.textContent = h;
    c.id = 'cell_'+h;
    c.onclick = function(){
      document.getElementById('hand').value = h;
      analyze();
    };
    g.appendChild(c);
  });
  updateChart();
}

function updateChart(){
  const range = getRange();
  allHands.forEach(h=>{
    const c = document.getElementById('cell_'+h);
    if(!c) return;
    if(handInRange(h, range)){
      c.className = 'cell raise';
    } else {
      c.className = 'cell fold';
    }
  });
}

function getRange(){
  return DATA[curStack] && DATA[curStack][curPos] && DATA[curStack][curPos][curAct] ? DATA[curStack][curPos][curAct] : [];
}

function setStack(s){
  curStack = s;
  document.querySelectorAll('.controls .btn-group:first-of-type .btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.controls .btn-group:first-of-type .btn').forEach((b,i)=>{
    if(['8','10','15','20','25'][i]===s) b.classList.add('active');
  });
  updateChart();
}

function setPosition(p){
  curPos = p;
  document.querySelectorAll('.controls .btn-group:nth-of-type(2) .btn').forEach(b=>b.classList.remove('active-blue'));
  document.querySelectorAll('.controls .btn-group:nth-of-type(2) .btn').forEach((b,i)=>{
    if(['BTN','SB','BB'][i]===p) b.classList.add('active-blue');
  });
  updateChart();
}

function setAction(a){
  curAct = a;
  document.querySelectorAll('.controls .btn-group:nth-of-type(3) .btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.controls .btn-group:nth-of-type(3) .btn').forEach((b,i)=>{
    if(['RFI','3bet','pushfold'][i]===a) b.classList.add('active');
  });
  updateChart();
}

function analyze(){
  const hand = document.getElementById('hand').value.toUpperCase().trim();
  if(!hand){ alert('Введите руку!'); return; }
  const range = getRange();
  let action = 'ФОЛД';
  let color = '#8b949e';
  if(handInRange(hand, range)){
    action = 'РЕЙЗ';
    color = '#f85149';
  }
  document.getElementById('resultAction').textContent = action;
  document.getElementById('resultAction').style.color = color;
  document.getElementById('resultDetails').textContent = hand + ' | ' + curStack + ' BB | ' + curPos;
  
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('selected'));
  const cell = document.getElementById('cell_'+hand);
  if(cell) cell.classList.add('selected');
}

window.onload = init;
